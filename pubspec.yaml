name: control_stok_celu
description: Gestor offline-first de stock, ventas y contabilidad.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^1.0.0
  file_picker: ^10.3.2
  mobile_scanner: ^7.1.3
  flutter_secure_storage: ^9.2.4
  logging: ^1.3.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.7.0
  sqlite3: ^3.5.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: logo.jpg
  min_sdk_android: 21
  web:
    generate: true
    image_path: logo.jpg
    background_color: "#ffffff"
    theme_color: "#d59a58"
  windows:
    generate: true
    image_path: logo.jpg
